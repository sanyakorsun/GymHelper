<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymHelper — Профіль</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>GymHelper</h1>
        <p>Твій персональний щоденник тренувань</p>
    </header>

    <main>
        <section class="profile">
            <h2>Створення профілю</h2>

            <input id="name" type="text" placeholder="Ім'я">

            <input id="age" type="number" placeholder="Вік">

            <input id="weight" type="number" step="0.1" placeholder="Вага (кг)">

            <input id="height" type="number" step="0.1" placeholder="Зріст (см)">

            <button onclick="createUser()">Створити профіль</button>

            <p id="message"></p>
        </section>
    </main>

    <a href="index.html">
        <button>На головну</button>
    </a>

    <script src="js/profile.js"></script>
</body>
</html>
