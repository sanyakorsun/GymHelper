<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymHelper</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>GymHelper</h1>
        <p>TRAIN HARD. TRACK EVERYTHING.</p>
    </header>

    <main>

        <section class="hero">
            <p class="hero-label">YOUR TRAINING JOURNEY</p>

            <h2>
                Тренуйся.<br>
                Записуй.<br>
                Прогресуй.
            </h2>

            <p class="hero-text">
                Твій персональний щоденник тренувань.
                Зберігай вправи, підходи та результати
                кожного тренування в одному місці.
            </p>
        </section>

        <section class="stats">
            <div class="stat">
                <span id="workoutCount">0</span>
                <p>Тренувань</p>
            </div>

            <div class="stat">
                <span id="exerciseCount">0</span>
                <p>Вправ</p>
            </div>

            <div class="stat">
                <span id="lastWorkout">—</span>
                <p>Останнє тренування</p>
            </div>
        </section>

        <section class="main-action">
            <a href="workout.html">
                <button>+ Нове тренування</button>
            </a>
        </section>

        <section class="menu-grid">

            <a href="profile.html">
                <button>Мій профіль</button>
            </a>

            <a href="exercises.html">
                <button>Мої вправи</button>
            </a>

            <a href="history.html">
                <button>Історія тренувань</button>
            </a>

        </section>

    </main>

    <script src="js/index.js?v=1"></script>
</body>
</html>
